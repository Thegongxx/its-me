name: Source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    env:
      DEMO_MODE: 'true'
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
  agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r desktop-agent/requirements.txt
      - run: python -m unittest discover -s desktop-agent/tests -v
