  <circle cx="1230" cy="231" r="58" stroke="#20211e" stroke-opacity=".2"/>
  <circle cx="1230" cy="231" r="42" stroke="#20211e" stroke-opacity=".12"/>
  <!-- Offset sheets create depth with crisp, print-like shadows. -->
  <g transform="translate(268 206) rotate(-10)">
    <path d="M14 24h505v652H14z" fill="#20211e" opacity=".08"/>
    <path d="M0 0h505v652H0z" fill="#b9afa0" stroke="#20211e" stroke-width="1.3"/>
