    </g>
    <path d="M64 53h330M64 91h330" stroke="#20211e" stroke-width="1"/>
    <text x="64" y="79" fill="#20211e" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="3.4">FIELD NOTES</text>
