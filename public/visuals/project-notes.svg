<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" fill="none" role="img" aria-labelledby="notes-title notes-desc">
  <title id="notes-title">A notebook for unfinished ideas</title>
  <desc id="notes-desc">Original editorial artwork: overlapping cream notebook sheets, a large geometric letter N, sparse writing rules, and an terracotta bookmark on a taupe background. This is an illustrative study, not a real learning record.</desc>
  <defs>
    <pattern id="notes-grid" width="27" height="27" patternUnits="userSpaceOnUse"><path d="M27 0H0V27" stroke="#20211e" stroke-opacity=".085" stroke-width=".8"/></pattern>
    <clipPath id="notes-page"><path d="M0 0h459v628H0z"/></clipPath>
  </defs>
  <path fill="#d6c9b7" d="M0 0h1400v1000H0z"/>
  <path d="M93 131h1214M93 868h1214" stroke="#20211e" stroke-opacity=".13"/>
