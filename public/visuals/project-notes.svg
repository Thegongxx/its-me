    <path d="M71 415c38-86 74-27 114-119s79-27 121-110 81-41 122-68" stroke="#20211e" stroke-width="2"/>
    <path d="M71 415h357M71 415V118" stroke="#20211e" stroke-opacity=".45"/>
    <circle cx="185" cy="296" r="8" fill="#ab6554" stroke="#20211e" stroke-width="1.5"/>
    <circle cx="306" cy="186" r="8" fill="#ab6554" stroke="#20211e" stroke-width="1.5"/>
    <path d="M62 481h367m-367 29h367m-367 29h289m-289 29h327" stroke="#20211e" stroke-opacity=".25"/>
  </g>
  <!-- The principal notebook is a typographic specimen, not a mock application. -->
  <g transform="translate(590 174) rotate(8)">
