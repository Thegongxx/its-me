<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" fill="none" role="img" aria-labelledby="signal-title signal-desc">
  <title id="signal-title">A signal with a human boundary</title>
  <desc id="signal-desc">Original geometric cover: a lime signal travels between two sculptural rings on a dark forest green field. Sparse paths and bounded nodes evoke selective, privacy-conscious sharing without presenting real activity data.</desc>
  <defs>
    <pattern id="signal-grid" width="70" height="70" patternUnits="userSpaceOnUse"><path d="M70 0H0V70" stroke="#d9e3ce" stroke-opacity=".045" stroke-width="1"/></pattern>
    <clipPath id="signal-orbit"><ellipse cx="683" cy="493" rx="440" ry="238" transform="rotate(-19 683 493)"/></clipPath>
  </defs>
  <path fill="#18372c" d="M0 0h1400v1000H0z"/>
  <path fill="url(#signal-grid)" d="M0 0h1400v1000H0z"/>
  <g stroke="#d8e5cc" stroke-opacity=".13" stroke-width="1">
