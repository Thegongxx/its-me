    <ellipse cx="683" cy="493" rx="479" ry="276" transform="rotate(-19 683 493)"/>
    <ellipse cx="683" cy="493" rx="440" ry="238" transform="rotate(-19 683 493)"/>
    <path d="m141 680 1087-374M474 102l318 788" stroke-dasharray="5 7"/>
  </g>
